name: Deploy Concept Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (matches repository bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies cleanly from bun.lock
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: npm run lint

      - name: Domain rules and content integrity tests
        run: npm test

      - name: Generate standalone HTML slides and build dist/
        run: npm run build

      - name: Verify relative subpath assets in dist/
        run: |
          test -f dist/index.html
          test -f dist/slides.html
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          if grep -qE '(src|href)="/assets/' dist/index.html; then
            echo "Detected non-relative /assets/ path in dist/index.html"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
